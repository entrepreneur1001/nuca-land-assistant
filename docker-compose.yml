# Optional: a real PostgreSQL instead of the embedded PGlite default.
#   docker compose up -d db
#   echo "DATABASE_URL=postgres://nuca:nuca@localhost:5432/nuca" >> .env.local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nuca
      POSTGRES_PASSWORD: nuca
      POSTGRES_DB: nuca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuca"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
