# Data sync. The real trigger is cron-job.org (see README "Data sync"): it POSTs to
#   https://api.github.com/repos/entrepreneur1001/nuca-land-assistant/actions/workflows/sync.yml/dispatches
# every 15 min Sunday–Thursday 10:00–22:00 Africa/Cairo, and hourly otherwise.
# GitHub's own `schedule` is best-effort (observed gaps of 2–6 h with "*/15"), so it is only a backup.
name: Sync NUCA data

on:
  schedule:
    - cron: "23 * * * *" # hourly backup, any day; cron-job.org drives the 15-minute cadence
  workflow_dispatch:
    inputs:
      full:
        description: "Force full plot sync"
        type: boolean
        default: false
      osm:
        description: "Force OpenStreetMap refresh"
        type: boolean
        default: false

# One run at a time; a dispatch that lands during a long run waits (GitHub keeps one pending run per group).
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Runs take 1.5–20 min; a hung run must not block more than one or two 15-minute slots.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sync into Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SOURCE_REFRESH_TOKEN: ${{ secrets.SOURCE_REFRESH_TOKEN }}
        run: npx tsx scripts/ingest.mts ${{ inputs.full && '--full' || '' }} ${{ inputs.osm && '--osm' || '' }}
