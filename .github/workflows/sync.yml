# One manual sync run from the official NUCA site (lands.nuca.gov.eg). The regular updates come from the 1-minute loop
# (live.yml), which runs around the clock and also does the nightly full pass; this workflow has no schedule any more.
# Use it for one-off jobs (re-discover zones, OpenStreetMap backfill, --accept-large) and only while no loop is
# running: two writers of meta/current would undo each other's changes and repeat alerts.
# A normal run crawls all ~110 zone tables (~7 min) plus OpenStreetMap work; a quick run crawls the stalest zones for
# 3 min and skips OpenStreetMap.
name: Sync NUCA data

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also crawl the booked views"
        type: boolean
        default: false
      zones:
        description: "Re-discover the zone list"
        type: boolean
        default: false
      quick:
        description: "Quick run: crawl the stalest zones for 3 min, skip OpenStreetMap (the 5-minute peak cadence)"
        type: boolean
        default: false
      accept_large:
        description: "Accept a run that marks more than the safety limit of plots booked"
        type: boolean
        default: false

# One run at a time; a dispatch that lands during a long run waits (GitHub keeps one pending run per group).
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Large form POSTs (the zone table's paging carries the page's ViewState) stall between GitHub's network and
      # lands.nuca.gov.eg at the default MTU (path-MTU blackhole); 1300 makes them go through. See README "Data sync".
      - name: Lower the MTU for the official site
        run: sudo ip link set dev "$(ip route show default | awk '{print $5}')" mtu 1300
      - name: Sync into Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          QUICK: ${{ inputs.quick && 'yes' || '' }}
        run: >
          if [ -n "$QUICK" ]; then export OFFICIAL_BUDGET_MS=180000 OSM_BUDGET_MS=0; fi;
          npx tsx scripts/ingest.mts
          ${{ inputs.full && '--full' || '' }}
          ${{ inputs.zones && '--zones' || '' }}
          ${{ inputs.accept_large && '--accept-large' || '' }}
