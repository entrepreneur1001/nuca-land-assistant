# Data sync from the official NUCA site (lands.nuca.gov.eg). The real trigger is cron-job.org (see README "Data sync"):
# it POSTs to https://api.github.com/repos/entrepreneur1001/nuca-land-assistant/actions/workflows/sync.yml/dispatches
# every 5 min Sunday–Thursday 10:00–22:00 Africa/Cairo as a quick run, and hourly (minute 5) as a normal run.
# GitHub's own `schedule` is best-effort (observed gaps of 2–6 h with "*/15"), so it is only a backup.
# A normal run crawls all ~110 zone tables (~7 min) plus OpenStreetMap work; a quick run crawls the stalest zones for
# 3 min and skips OpenStreetMap, so it fits the 5-minute slot. A dispatch that lands during a run queues behind it.
name: Sync NUCA data

on:
  schedule:
    - cron: "23 * * * *" # hourly backup, any day; cron-job.org drives the 15-minute cadence
    - cron: "17 1 * * *" # 03:17 Cairo: full pass (booked views too)
  workflow_dispatch:
    inputs:
      full:
        description: "Also crawl the booked views"
        type: boolean
        default: false
      zones:
        description: "Re-discover the zone list"
        type: boolean
        default: false
      quick:
        description: "Quick run: crawl the stalest zones for 3 min, skip OpenStreetMap (the 5-minute peak cadence)"
        type: boolean
        default: false
      accept_large:
        description: "Accept a run that marks more than the safety limit of plots booked"
        type: boolean
        default: false

# One run at a time; a dispatch that lands during a long run waits (GitHub keeps one pending run per group).
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Large form POSTs (the zone table's paging carries the page's ViewState) stall between GitHub's network and
      # lands.nuca.gov.eg at the default MTU (path-MTU blackhole); 1300 makes them go through. See README "Data sync".
      - name: Lower the MTU for the official site
        run: sudo ip link set dev "$(ip route show default | awk '{print $5}')" mtu 1300
      - name: Sync into Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          QUICK: ${{ inputs.quick && 'yes' || '' }}
        run: >
          if [ -n "$QUICK" ]; then export OFFICIAL_BUDGET_MS=180000 OSM_BUDGET_MS=0; fi;
          npx tsx scripts/ingest.mts
          ${{ (inputs.full || github.event.schedule == '17 1 * * *') && '--full' || '' }}
          ${{ inputs.zones && '--zones' || '' }}
          ${{ inputs.accept_large && '--accept-large' || '' }}
