# The 1-minute loop, running around the clock (see README "Data sync" and src/ingest/live.ts). cron-job.org dispatches
# it every 10 minutes, every day. Each job loops for LIVE_MINUTES (350); in the `live` group GitHub keeps one run going
# and one waiting, so the waiting run starts the moment the running one ends (or crashes) and the loops follow each
# other back to back. The loop is the only regular writer of meta/current: it also does the nightly full pass, so
# sync.yml is manual only (don't dispatch it while a loop is running: two writers would undo each other's changes).
name: Live sync (1 min)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to loop (max ~355: a job may run 6 h)"
        default: "350"
      dry_run:
        description: "Crawl and log only, write nothing"
        type: boolean
        default: false

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Same path-MTU workaround as sync.yml: the zone table's paging POSTs stall at the default MTU.
      - name: Lower the MTU for the official site
        run: sudo ip link set dev "$(ip route show default | awk '{print $5}')" mtu 1300
      - name: Loop
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LIVE_MINUTES: ${{ inputs.minutes }}
        run: npx tsx scripts/live.mts ${{ inputs.dry_run && '--dry-run' || '' }}
